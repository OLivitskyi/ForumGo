<div>
    <h1>Register</h1>
    <form id="registerForm">
        <div class="mb-2">
            <label for="userName" class="form-label">Choose Your Username</label>
            <input type="text" class="form-control" id="userName" name="userName" required>
        </div>
        <div class="mb-2">
            <label for="email" class="form-label">Enter Your Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-2">
            <label for="password" class="form-label">Choose Your Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-2">
            <label for="rePassword" class="form-label">Reenter the Password</label>
            <input type="password" class="form-control" id="rePassword" name="rePassword" required>
        </div>
        <div class="mb-2">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" name="firstName" required>
        </div>
        <div class="mb-2">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" name="lastName" required>
        </div>
        <div class="mb-2">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" name="age" required>
        </div>
        <div class="mb-2">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-control" id="gender" name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Register</button>
    </form>
    <div id="registerError" class="alert alert-danger mt-3" style="display: none;"></div>
</div>
